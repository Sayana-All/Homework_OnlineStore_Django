{% extends "catalog/base.html" %}

{% block title %}Вход на сайт{% endblock %}

{% block content %}
<div class="pricing-header p-3 pb-md-4 mx-auto text-center">
    <h2 class="display-4"><b>Вход на сайт</b></h2>
</div>

<div class="container text-center">
    <div class="row justify-content-center">
        <form method="post" action="" class="form-floating" enctype="multipart/form-data">
            <div class="col-md-6 offset-md-3">
                <div class="card mb-4 box-shadow">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">Введите данные для входа:</h4>

                    </div>
                    <div class="card-body">
                        {% csrf_token %}
                        <div class="mb-3 text-warning p-2">
                            <p><em>Для доступа к большему функционалу сайта и своему профилю необходимо войти в аккаунт.</em></p>
                        </div>
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-lg btn-outline-primary">Войти</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
